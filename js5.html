<!DOCTYPE html>
<html>
<head>
    <title>For Loop</title>

    <script>
        function printNumbers() {

            let result = "";

            for (let i = 1; i <= 10; i++) {

                result = result + i + "<br>";

            }

            document.getElementById("demo").innerHTML = result;

        }
    </script>
</head>

<body>

    <h2>JavaScript For Loop</h2>

    <p id="demo">Numbers will appear here.</p>

    <button onclick="printNumbers()">Print Numbers</button>

</body>
</html>
