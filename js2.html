<!DOCTYPE html>
<html>
<head>
    <title>If Condition</title>

    <script>
        function checkAge() {

            let age = 20;

            if (age >= 18) {
                document.getElementById("demo").innerHTML =
                    "You are eligible to vote.";
            }

        }
    </script>
</head>

<body>

    <h2>JavaScript If Condition</h2>

    <p id="demo">Check your eligibility.</p>

    <button onclick="checkAge()">Check Age</button>

</body>
</html>
