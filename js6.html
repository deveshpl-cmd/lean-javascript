<!DOCTYPE html>
<html>
<head>
    <title>While Loop</title>

    <script>
        function printNumbers() {

            let i = 1;
            let result = "";

            while (i <= 5) {

                result = result + i + "<br>";

                i++;

            }

            document.getElementById("demo").innerHTML = result;

        }
    </script>
</head>

<body>

    <h2>JavaScript While Loop</h2>

    <p id="demo">Click to print numbers.</p>

    <button onclick="printNumbers()">Start Loop</button>

</body>
</html>
