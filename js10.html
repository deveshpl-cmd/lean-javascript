<!DOCTYPE html>
<html>
<head>
    <title>Insert Data</title>

    <script>

        let students = ["Rahul", "Aman", "Kiran"];

        function addStudent() {

            let name = document.getElementById("username").value;

            students.push(name);

            document.getElementById("demo").innerHTML = students;

        }

    </script>
</head>

<body>

    <h2>Add Student</h2>

    Enter Student Name:

    <input type="text" id="username">

    <button onclick="addStudent()">Add Student</button>

    <p id="demo">Student list will appear here.</p>

</body>
</html>
