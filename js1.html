<!DOCTYPE html>
<html>
<head>
    <title>Variables</title>

    <script>
        function showDetails() {

            let name = "Devesh";
            let age = 20;
            let college = "MSRIT";

            document.getElementById("demo").innerHTML =
                "Name: " + name + "<br>" +
                "Age: " + age + "<br>" +
                "College: " + college;

        }
    </script>
</head>

<body>

    <h2>JavaScript Variables</h2>

    <p id="demo">Click the button to see details.</p>

    <button onclick="showDetails()">Show Details</button>

</body>
</html>
