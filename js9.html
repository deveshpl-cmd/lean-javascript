<!DOCTYPE html>
<html>
<head>
    <title>Arrays</title>

    <script>
        function showFruits() {

            let fruits = ["Apple", "Mango", "Orange", "Banana"];

            document.getElementById("demo").innerHTML =
                fruits;

        }
    </script>
</head>

<body>

    <h2>JavaScript Arrays</h2>

    <p id="demo">Fruit names will appear here.</p>

    <button onclick="showFruits()">Show Fruits</button>

</body>
</html>
